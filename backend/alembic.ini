# Alembic configuration for the AI Engineering Change Auditor.
#
# The database URL is NOT set here: migrations/env.py reads it from the
# application Settings (DATABASE_URL) so that a single configuration works
# against PostgreSQL in production and SQLite in local development. Secrets
# therefore never appear in this file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
# Deterministic, human-readable revision filenames.
file_template = %%(rev)s_%%(slug)s
version_path_separator = os
timezone = UTC

# sqlalchemy.url is intentionally absent; env.py supplies it.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
